name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  quality-gate:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  build-go:
    # frontend/dist is built and uploaded by the quality gate (quality.yml),
    # so there is no separate build-frontend job.
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: 0
      GOOS: linux
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.25.13"

      - name: Download frontend dist
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: frontend-dist
          path: web/dist

      - name: Build Go binary
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="main-$(git rev-parse --short HEAD)"
          fi
          mkdir -p "build/bupt-ec-linux-${GOARCH}"
          go build -trimpath -tags embed_assets -ldflags "-s -w -X main.version=${version}" \
            -o "build/bupt-ec-linux-${GOARCH}/bupt-ec" -v ./

      - name: Upload Go binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bupt-ec-linux-${{ matrix.goarch }}
          path: build/bupt-ec-linux-${{ matrix.goarch }}/bupt-ec

  release:
    needs: build-go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download Linux amd64 binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: bupt-ec-linux-amd64
          path: release/bupt-ec-linux-amd64

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: bupt-ec-linux-arm64
          path: release/bupt-ec-linux-arm64

      - name: Check generated installer
        run: bash scripts/generate-install.sh --check

      - name: Compose release assets
        # Only the generated self-contained artifact is packaged; source fragments
        # remain repository-only inputs to scripts/generate-install.sh.
        run: |
          set -euo pipefail
          cd release
          for arch in amd64 arm64; do
            package_dir="bupt-ec-linux-${arch}"
            cp ../.env.example ../README.md ../scripts/install.sh "${package_dir}/"
            chmod +x "${package_dir}/install.sh"
            tar -czf "${package_dir}.tar.gz" "${package_dir}"

            # Lock the documented package layout and prove the packaged
            # installer is exactly the generated top-level artifact.
            tar -tzf "${package_dir}.tar.gz" | sort > "${package_dir}.actual"
            printf '%s\n' \
              "${package_dir}/" \
              "${package_dir}/.env.example" \
              "${package_dir}/README.md" \
              "${package_dir}/bupt-ec" \
              "${package_dir}/install.sh" | sort > "${package_dir}.expected"
            diff -u "${package_dir}.expected" "${package_dir}.actual"
            tar -xOzf "${package_dir}.tar.gz" "${package_dir}/install.sh" | \
              cmp - ../scripts/install.sh
            rm -f "${package_dir}.actual" "${package_dir}.expected"
          done
          cp ../scripts/install.sh install.sh
          chmod +x install.sh
          sha256sum bupt-ec-linux-*.tar.gz > checksums.txt
          ls -la

      - name: Attest release assets
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2.4.0
        with:
          subject-path: |
            release/bupt-ec-linux-amd64.tar.gz
            release/bupt-ec-linux-arm64.tar.gz
            release/checksums.txt
            release/install.sh

      # Only `v*` tag pushes publish. Pushes to main and manual dispatches run
      # the identical pack/checksum/attest path as a dry-run so a broken
      # packaging step surfaces on merge, not on release day.
      - name: Upload dry-run release assets
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'branch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-dry-run
          path: |
            release/bupt-ec-linux-amd64.tar.gz
            release/bupt-ec-linux-arm64.tar.gz
            release/checksums.txt
            release/install.sh

      - name: Extract release notes from changelog
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: scripts/extract-changelog.sh "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish release (tag push - stable versioned)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Stable notes are the matching CHANGELOG section only (no GitHub auto notes).
          body_path: release-notes.md
          files: |
            release/bupt-ec-linux-amd64.tar.gz
            release/bupt-ec-linux-arm64.tar.gz
            release/checksums.txt
            release/install.sh
