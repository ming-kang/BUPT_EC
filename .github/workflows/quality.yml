# NOTE: Keep the commands in this gate in sync with Taskfile.yml and
# docs/development.md (local developers run the same checks via `task check`,
# `task test`, and `task build`).
name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: pnpm audit:prod

      - name: Audit frontend toolchain dependencies
        working-directory: frontend
        run: pnpm audit:dev

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "1.25.12"

      - name: Check Go module tidiness
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod/go.sum are out of sync with the import graph."
            echo "Run: GOTOOLCHAIN=go1.25.12 go mod tidy"
            exit 1
          fi

      - name: Verify Go modules
        run: go mod verify

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "Files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Vet Go packages
        run: go vet ./...

      - name: Test Go packages
        run: go test -race ./...

      - name: Build Go packages
        run: go build ./...

      - name: Build with embedded assets
        # vet/test/build above stay tag-less on purpose: they gate the bare
        # clone (placeholder) build. This step catches embed pattern breakage
        # before release.
        run: |
          rm -rf web/dist
          cp -r frontend/dist web/dist
          go build -tags embed_assets ./...

      - name: Run govulncheck
        # go run reuses the module/build caches managed by actions/setup-go,
        # so the tool is only compiled from scratch on a cache miss.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

      - name: Test shell scripts
        run: bash scripts/install_test.sh

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
